services:
  - type: web
    name: nrg-engine
    env: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MPLBACKEND
        value: Agg

  - type: web
    name: nrg-interactive-worker
    env: docker
    branch: main
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MPLBACKEND
        value: Agg
      - key: ALLOWED_ORIGINS
        value: "*"
