services:
  nrg-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nrg-engine
    restart: unless-stopped
    ports:
      - "${PORT:-10000}:10000"
    environment:
      - PORT=10000
      - NODE_ENV=production
      - MPLBACKEND=Agg
      - NRG_SESSION_SECRET=${NRG_SESSION_SECRET:-}
      - JUDGE0_API_URL=${JUDGE0_API_URL:-https://ce.judge0.com}
      - JUDGE0_API_KEY=${JUDGE0_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
    volumes:
      - nrg_data:/app/.nrg_data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nrg-interactive-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: nrg-interactive-worker
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MPLBACKEND=Agg
      - WORKER_AUTH_TOKEN=${WORKER_AUTH_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  nrg_data:
