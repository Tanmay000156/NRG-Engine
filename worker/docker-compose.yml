version: '3.8'

services:
  nrg-interactive-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nrg-interactive-worker
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - WORKER_AUTH_TOKEN=
      - ALLOWED_ORIGINS=*
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
